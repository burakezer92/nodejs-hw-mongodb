tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: Update a contact with payload
security:
  - bearerAuth: []

parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'

requestBody:
  required: false
  content:
    multipart/form-data:
      schema:
        type: object
        additionalProperties: false
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'

          phoneNumber:
            description: "Contact's Phone Number"
            type: string
            example: '5555555555'

          contactType:
            description: 'Contact Type'
            type: string
            enum: ['work', 'home', 'personal']

          isFavourite:
            description: 'Contact is favourite'
            type: boolean
            example: true

          email:
            description: "Contact's email"
            type: string
            example: 'johndoe@gmail.com'

          userId:
            description: "Contact's user id"
            type: string
            example: '65e4decdd286b30065d54af9'

          photo:
            description: "Contact's photo"
            type: string
            format: binary

responses:
  '200':
    description: Successfully updated a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated a contact!
            data:
              $ref: '../../../components/schemas/contact.yaml'

  '401':
    $ref: '../../../components/responses/401.yaml'
